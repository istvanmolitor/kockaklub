services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        container_name: kockaklub
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - webproxy
        depends_on:
            - mysql
            - mailpit
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=webproxy"
            - "traefik.http.routers.kockaklub.entrypoints=websecure"
            - "traefik.http.routers.kockaklub.rule=Host(`kockaklub.hu`) || Host(`www.kockaklub.hu`)"
            - "traefik.http.routers.kockaklub.tls.certresolver=myresolver"
            - "traefik.http.services.kockaklub.loadbalancer.server.port=80"
            - "traefik.http.routers.kockaklub-http.entrypoints=web"
            - "traefik.http.routers.kockaklub-http.rule=Host(`kockaklub.hu`) || Host(`www.kockaklub.hu`)"
            - "traefik.http.routers.kockaklub-http.middlewares=redirect-to-https"
    mysql:
        image: 'mariadb:11.4'
        container_name: kockaklub-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: kockaklub-mailpit
        restart: unless-stopped
        networks:
            - sail
networks:
    sail:
        driver: bridge
    webproxy:
        external: true
volumes:
    sail-mysql:
        driver: local
